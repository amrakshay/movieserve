name: Feature request
description: Suggest something
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please read the scope section of [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) first.
        Transcoding, accounts, a web UI and metadata scraping are deliberately out of scope —
        Jellyfin and Plex do those well, and this project stays small on purpose.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you hit, not the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What did you have in mind?

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I have read the scope section and believe this fits
          required: true
