name: Release

# Pushing a v* tag builds both apps and publishes them on a GitHub release.
# The tag is checked against the VERSION file first, so a mistyped tag fails loudly
# instead of shipping artefacts labelled with the wrong number.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches VERSION
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE="$(cat VERSION | tr -d '[:space:]')"
          echo "tag=$TAG VERSION=$FILE"
          if [ "$TAG" != "$FILE" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($FILE)"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Server tests
        run: python -m unittest discover -s server/tests -v

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          # The action's default package list includes "tools", which Google has retired, and
          # sdkmanager fails the job rather than skipping it. Name what the build actually needs.
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Restore the release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MOVIESERVE_KEYSTORE_BASE64 }}
        run: |
          # The real key, so an installed app can be upgraded in place across releases. Without
          # the secret the build would silently produce an unsigned APK, which is worse than
          # failing, so check for it.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::MOVIESERVE_KEYSTORE_BASE64 is not set; refusing to publish unsigned APKs"
            exit 1
          fi
          mkdir -p "$HOME/.movieserve"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.movieserve/release.keystore"
          chmod 600 "$HOME/.movieserve/release.keystore"
          # Pass the path on through the environment file rather than a workflow expression. The
          # env context does not carry system variables, so an expression referring to env.HOME
          # expands to nothing and Gradle quietly builds unsigned instead of failing.
          # (Written out in words on purpose: GitHub evaluates expression syntax even inside a
          # shell comment, and an empty one makes the whole workflow file invalid.)
          echo "MOVIESERVE_KEYSTORE=$HOME/.movieserve/release.keystore" >> "$GITHUB_ENV"

      - name: Build the TV app
        working-directory: tv-app
        env:
          MOVIESERVE_KEYSTORE_PASSWORD: ${{ secrets.MOVIESERVE_KEYSTORE_PASSWORD }}
          MOVIESERVE_KEY_PASSWORD: ${{ secrets.MOVIESERVE_KEY_PASSWORD }}
          MOVIESERVE_KEY_ALIAS: movieserve
        run: ./gradlew test assembleRelease --console=plain

      - name: Build the phone app
        working-directory: phone-app
        env:
          MOVIESERVE_KEYSTORE_PASSWORD: ${{ secrets.MOVIESERVE_KEYSTORE_PASSWORD }}
          MOVIESERVE_KEY_PASSWORD: ${{ secrets.MOVIESERVE_KEY_PASSWORD }}
          MOVIESERVE_KEY_ALIAS: movieserve
        run: ./gradlew test assembleRelease --console=plain

      - name: Check the APKs are signed with the release key
        run: |
          # A silently unsigned or wrongly signed APK would only be discovered by a user whose
          # upgrade was refused, so confirm the signer here instead.
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          for apk in tv-app/app/build/outputs/apk/release/app-release.apk \
                     phone-app/app/build/outputs/apk/release/app-release.apk; do
            echo "--- $apk"
            if [ ! -f "$apk" ]; then
              # Gradle names the output app-release-unsigned.apk when it had no keystore, so a
              # missing file here means signing did not happen rather than the build failing.
              echo "::error::$apk is missing; the build produced an unsigned APK, so the signing key was not picked up"
              ls -la "$(dirname "$apk")" || true
              exit 1
            fi
            "$APKSIGNER" verify --print-certs "$apk" | grep -E "Signer #1 certificate (DN|SHA-256)"
            "$APKSIGNER" verify --print-certs "$apk" | grep -q "CN=movieserve" || {
              echo "::error::$apk is not signed with the movieserve release key"; exit 1; }
          done

      - name: Name the APKs after the release
        run: |
          mkdir -p dist
          cp tv-app/app/build/outputs/apk/release/app-release.apk \
             "dist/movieserve-tv-${GITHUB_REF_NAME}.apk"
          cp phone-app/app/build/outputs/apk/release/app-release.apk \
             "dist/movieserve-phone-${GITHUB_REF_NAME}.apk"
          ls -la dist

      - name: Pull this version's notes out of the changelog
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # The section from this version's heading to the next one.
          awk -v v="$TAG" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No changelog section for $TAG; falling back to a generated list." > release-notes.md
          fi
          {
            echo ""
            echo "### About these APKs"
            echo ""
            echo "Signed with the project's release key, so an installed version can be upgraded"
            echo "in place. Sideload with:"
            echo ""
            echo '```'
            echo "adb install -r movieserve-tv-${GITHUB_REF_NAME}.apk"
            echo '```'
          } >> release-notes.md
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          body_path: release-notes.md
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
