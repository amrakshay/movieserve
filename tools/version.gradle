// Shared by both Android projects: the version comes from the repository's VERSION file, so a
// release is one edit rather than four that can disagree.
//
// versionCode has to be a monotonically increasing integer, so it is derived rather than tracked
// separately: 1.2.3 becomes 10203. That holds as long as minor and patch stay under 100.
def versionFile = new File(rootDir, '../VERSION')
if (!versionFile.exists()) {
    throw new GradleException("VERSION not found at ${versionFile.canonicalPath}")
}
def raw = versionFile.text.trim()
def match = (raw =~ /^(\d+)\.(\d+)\.(\d+)$/)
if (!match.matches()) {
    throw new GradleException("VERSION must look like 1.2.3, got '${raw}'")
}
ext.movieserveVersionName = raw
ext.movieserveVersionCode = match[0][1].toInteger() * 10000 +
        match[0][2].toInteger() * 100 +
        match[0][3].toInteger()
