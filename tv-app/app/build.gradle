plugins {
    id 'com.android.application'
}

// Reads the repository's VERSION file into movieserveVersionName / movieserveVersionCode.
apply from: "$rootDir/../tools/version.gradle"

android {
    namespace 'com.amrakshay.movieserve'
    compileSdk 34

    defaultConfig {
        applicationId 'com.amrakshay.movieserve'
        // Android 5.0. The TV this was written for runs Android 9 (SDK 28); there is no
        // reason to exclude older sets, since the app does no decoding of its own.
        minSdk 21
        targetSdk 34
        versionCode movieserveVersionCode
        versionName movieserveVersionName
    }

    // A sideloaded app still has to be signed with something, so `assembleRelease` falls back to
    // the SDK's debug keystore and is directly installable with no setup. That keystore does not
    // exist on a fresh CI runner, and a missing file here fails the whole build at
    // validateSigningRelease, so the config is only wired up when the file is actually there.
    // Supply your own keystore through the environment to sign a build for anyone else.
    def keystorePath = System.getenv('MOVIESERVE_KEYSTORE')
            ?: "${System.properties['user.home']}/.android/debug.keystore"
    def keystore = file(keystorePath)
    if (keystore.exists()) {
        signingConfigs {
            release {
                storeFile keystore
                storePassword System.getenv('MOVIESERVE_KEYSTORE_PASSWORD') ?: 'android'
                keyAlias System.getenv('MOVIESERVE_KEY_ALIAS') ?: 'androiddebugkey'
                keyPassword System.getenv('MOVIESERVE_KEY_PASSWORD') ?: 'android'
            }
        }
    } else {
        logger.lifecycle("movieserve: no keystore at ${keystorePath}; release build will be unsigned")
    }

    buildTypes {
        release {
            if (keystore.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // The CI build should fail on a real error, not on a style warning.
        abortOnError true
        warningsAsErrors false
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // Android ships org.json, but the JVM unit tests need a real implementation
    // instead of the stubbed one, so the parser can be tested without a device.
    testImplementation 'org.json:json:20240303'
    testImplementation 'junit:junit:4.13.2'
}
